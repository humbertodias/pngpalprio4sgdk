name: CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:

  Linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Maven cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
          key: maven-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '8'
          cache: maven

      - name: Package with Maven
        run: |
          mvn -B -e -ntp clean package

      # Upload artifact ONLY when it is NOT a tag push
      - name: Upload artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v5
        with:
          name: PPPE4SGDK.jar
          path: target/PPPE4SGDK.jar

      # Release ONLY when it IS a tag push
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: target/PPPE4SGDK.jar
